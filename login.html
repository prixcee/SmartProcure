<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | SmartProcure</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>

<body class="auth-page">

<header class="navbar">
    <div class="logo">🌾 SmartProcure</div>

    <nav>
        <a href="index.html">Home</a>
        <a href="centre.html">Centres</a>
    </nav>
</header>


<main class="auth-container">

    <div class="auth-card">

        <div class="auth-header">
            <span class="badge">FARMER PORTAL</span>

            <h1>Welcome Back</h1>

            <p>
                Login to manage your procurement bookings.
            </p>
        </div>


        <form>

            <div class="form-group">
                <label for="login-email">
                    Email or Mobile Number
                </label>

                <input
                    type="text"
                    id="login-email"
                    placeholder="Enter email or mobile"
                    required
                >
            </div>


            <div class="form-group">
                <label for="login-password">
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter password"
                    required
                >
            </div>


            <div class="form-options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">Forgot Password?</a>

            </div>


            <button type="submit" class="btn primary-btn full-btn">
                Login
            </button>

        </form>


        <div class="auth-footer">
            <p>
                Don't have an account?
                <a href="register.html">Create Account</a>
            </p>
        </div>

    </div>

</main>


<footer>
    <p>© 2026 SmartProcure • SIH26032</p>
</footer>

</body>
</html>
